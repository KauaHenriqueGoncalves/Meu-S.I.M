<div class="config-container">
  <div class="page-header">
    <h1>Configurações</h1>
    <p>Gerencie as preferências e opções do seu reforço escolar.</p>
  </div>

  <div class="config-list">
    <app-accessibility-settings></app-accessibility-settings>

    @if (this.role === 'school_admin') {
       <app-settings-nav-item
        title="Meu Perfil"
        description="Edite seus dados pessoais e senha."
        (click)="navigateToProfile()">
      </app-settings-nav-item>
    }

    @if (this.role === 'school_admin') {
      <app-settings-nav-item
        title="Assinatura"
        description="Veja e gerencie sua licença."
        route="/app/my-subscriptions">
      </app-settings-nav-item>
    }

    @if (this.role === 'school_admin') {
      <app-settings-nav-item
        title="Editar Reforço"
        description="Edite as informações do seu reforço escolar."
        route="/app/configurations/edit-school">
      </app-settings-nav-item>
    }
  </div>
</div>
