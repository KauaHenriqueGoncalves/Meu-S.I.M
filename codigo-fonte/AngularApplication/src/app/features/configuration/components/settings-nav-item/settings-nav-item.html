@if (route) {
  <a [routerLink]="route" class="settings-item">
    <div class="info">
      <h3>{{ title }}</h3>
      <p>{{ description }}</p>
    </div>
    <span class="arrow">
      <app-svg-angle-down color="currentColor" [size]="14" />
    </span>
  </a>
} @else {
  <div class="settings-item">
    <div class="info">
      <h3>{{ title }}</h3>
      <p>{{ description }}</p>
    </div>
    <span class="arrow">
      <app-svg-angle-down color="currentColor" [size]="14" />
    </span>
  </div>
}
